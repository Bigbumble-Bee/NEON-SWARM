<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SWARM</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #080812;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
        height: 100vh;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background:
            radial-gradient(circle at center, #15152c 0%, #080812 70%);
    }

    #ui {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 18px 25px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        z-index: 5;
        font-weight: bold;
        letter-spacing: 2px;
        text-shadow: 0 0 10px #00ffff;
    }

    #score {
        color: #00ffff;
    }

    #lives {
        color: #ff4d8d;
    }

    #level {
        color: #ffe66d;
    }

    .screen {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: rgba(5, 5, 15, 0.88);
        z-index: 10;
        text-align: center;
    }

    .hidden {
        display: none;
    }

    h1 {
        font-size: clamp(55px, 10vw, 120px);
        letter-spacing: 12px;
        color: #00ffff;
        text-shadow:
            0 0 10px #00ffff,
            0 0 30px #00ffff,
            0 0 70px #0066ff;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #ff4d8d;
        letter-spacing: 5px;
        margin-bottom: 35px;
        font-size: 14px;
    }

    button {
        background: transparent;
        color: #00ffff;
        border: 2px solid #00ffff;
        padding: 15px 40px;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 4px;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 0 15px rgba(0,255,255,0.3);
    }

    button:hover {
        background: #00ffff;
        color: #080812;
        box-shadow:
            0 0 15px #00ffff,
            0 0 40px #00ffff;
        transform: scale(1.05);
    }

    .instructions {
        margin-top: 30px;
        color: #aaa;
        line-height: 1.8;
        font-size: 14px;
    }

    .instructions span {
        color: #00ffff;
    }

    #finalScore {
        font-size: 28px;
        color: #ffe66d;
        margin-bottom: 25px;
        text-shadow: 0 0 15px #ffe66d;
    }

    #mobileControls {
        display: none;
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 8;
        user-select: none;
    }

    .control-row {
        display: flex;
        justify-content: center;
    }

    .control {
        width: 60px;
        height: 60px;
        margin: 4px;
        border: 1px solid rgba(0,255,255,0.4);
        background: rgba(0,255,255,0.08);
        color: #00ffff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 25px;
        border-radius: 10px;
    }

    @media (max-width: 700px) {
        #mobileControls {
            display: block;
        }

        h1 {
            letter-spacing: 5px;
        }

        .instructions {
            padding: 0 25px;
        }
    }
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    <div id="score">SCORE: 0</div>
    <div id="level">LEVEL: 1</div>
    <div id="lives">LIVES: ♥ ♥ ♥</div>
</div>

<div id="startScreen" class="screen">
    <h1>NEON SWARM</h1>
    <div class="subtitle">SURVIVE THE DIGITAL VOID</div>

    <button onclick="startGame()">START GAME</button>

    <div class="instructions">
        <span>WASD / ARROWS</span> — MOVE<br>
        <span>SPACE</span> — DASH<br>
        Collect <span>YELLOW ENERGY</span><br>
        Avoid the <span>RED SWARM</span>
    </div>
</div>

<div id="gameOverScreen" class="screen hidden">
    <h1>GAME OVER</h1>

    <div id="finalScore">
        SCORE: 0
    </div>

    <button onclick="startGame()">PLAY AGAIN</button>

    <div class="instructions">
        You survived the swarm.
    </div>
</div>

<div id="mobileControls">
    <div class="control-row">
        <div class="control" data-key="ArrowUp">▲</div>
    </div>

    <div class="control-row">
        <div class="control" data-key="ArrowLeft">◀</div>
        <div class="control" data-key="ArrowDown">▼</div>
        <div class="control" data-key="ArrowRight">▶</div>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let width;
let height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


// ===============================
// GAME STATE
// ===============================

let gameRunning = false;

let score = 0;
let lives = 3;
let level = 1;

let energy;
let enemies = [];
let particles = [];
let stars = [];

let enemyTimer = 0;
let energyTimer = 0;

let dashCooldown = 0;
let dashTimer = 0;

const keys = {};


// ===============================
// PLAYER
// ===============================

const player = {
    x: width / 2,
    y: height / 2,

    radius: 14,

    speed: 4,

    color: "#00ffff",

    invincible: 0
};


// ===============================
// INPUT
// ===============================

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        dash();
    }

    if (
        ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "]
        .includes(e.key)
    ) {
        e.preventDefault();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});


// ===============================
// MOBILE CONTROLS
// ===============================

document.querySelectorAll(".control").forEach(button => {

    const key = button.dataset.key.toLowerCase();

    button.addEventListener("touchstart", e => {
        e.preventDefault();
        keys[key] = true;
    });

    button.addEventListener("touchend", e => {
        e.preventDefault();
        keys[key] = false;
    });

});


// ===============================
// START GAME
// ===============================

function startGame() {

    score = 0;
    lives = 3;
    level = 1;

    enemies = [];
    particles = [];

    energy = null;

    enemyTimer = 0;
    energyTimer = 0;

    dashCooldown = 0;
    dashTimer = 0;

    player.x = width / 2;
    player.y = height / 2;
    player.invincible = 0;

    gameRunning = true;

    document
        .getElementById("startScreen")
        .classList.add("hidden");

    document
        .getElementById("gameOverScreen")
        .classList.add("hidden");

    updateUI();
}


// ===============================
// DASH
// ===============================

function dash() {

    if (!gameRunning) return;

    if (dashCooldown > 0) return;

    dashCooldown = 90;
    dashTimer = 12;

    createExplosion(
        player.x,
        player.y,
        "#00ffff",
        20
    );
}


// ===============================
// UPDATE
// ===============================

function update() {

    if (!gameRunning) return;

    updatePlayer();

    spawnEnemies();

    spawnEnergy();

    updateEnemies();

    updateParticles();

    updateEnergy();

    if (dashCooldown > 0) {
        dashCooldown--;
    }

    if (dashTimer > 0) {
        dashTimer--;
    }

    if (player.invincible > 0) {
        player.invincible--;
    }

    level = Math.floor(score / 100) + 1;

    updateUI();
}


// ===============================
// PLAYER MOVEMENT
// ===============================

function updatePlayer() {

    let dx = 0;
    let dy = 0;

    if (keys["w"] || keys["arrowup"]) {
        dy--;
    }

    if (keys["s"] || keys["arrowdown"]) {
        dy++;
    }

    if (keys["a"] || keys["arrowleft"]) {
        dx--;
    }

    if (keys["d"] || keys["arrowright"]) {
        dx++;
    }

    if (dx !== 0 || dy !== 0) {

        const length = Math.sqrt(dx * dx + dy * dy);

        dx /= length;
        dy /= length;

        let speed = player.speed;

        if (dashTimer > 0) {
            speed = 12;
        }

        player.x += dx * speed;
        player.y += dy * speed;

        createParticle(
            player.x,
            player.y,
            "#00ffff",
            0.3
        );
    }

    player.x = Math.max(
        player.radius,
        Math.min(width - player.radius, player.x)
    );

    player.y = Math.max(
        player.radius,
        Math.min(height - player.radius, player.y)
    );
}


// ===============================
// ENEMIES
// ===============================

function spawnEnemies() {

    enemyTimer++;

    const spawnRate = Math.max(
        20,
        70 - level * 4
    );

    if (enemyTimer < spawnRate) return;

    enemyTimer = 0;

    let side = Math.floor(Math.random() * 4);

    let x;
    let y;

    if (side === 0) {
        x = Math.random() * width;
        y = -30;
    }

    else if (side === 1) {
        x = width + 30;
        y = Math.random() * height;
    }

    else if (side === 2) {
        x = Math.random() * width;
        y = height + 30;
    }

    else {
        x = -30;
        y = Math.random() * height;
    }

    const angle = Math.atan2(
        player.y - y,
        player.x - x
    );

    const speed =
        1.2 +
        Math.random() * 1.5 +
        level * 0.12;

    enemies.push({
        x,
        y,
        radius: 10 + Math.random() * 7,
        speed,
        angle,
        wobble: Math.random() * Math.PI * 2
    });
}


function updateEnemies() {

    for (let i = enemies.length - 1; i >= 0; i--) {

        const enemy = enemies[i];

        const angle = Math.atan2(
            player.y - enemy.y,
            player.x - enemy.x
        );

        enemy.angle +=
            (angle - enemy.angle) * 0.025;

        enemy.wobble += 0.05;

        enemy.x +=
            Math.cos(enemy.angle) *
            enemy.speed;

        enemy.y +=
            Math.sin(enemy.angle) *
            enemy.speed;

        // Collision with player
        const distance = Math.hypot(
            player.x - enemy.x,
            player.y - enemy.y
        );

        if (
            distance <
            player.radius + enemy.radius
        ) {

            if (player.invincible <= 0) {

                lives--;

                player.invincible = 100;

                createExplosion(
                    player.x,
                    player.y,
                    "#ff4d8d",
                    30
                );

                enemies.splice(i, 1);

                if (lives <= 0) {
                    endGame();
                }
            }
        }
    }
}


// ===============================
// ENERGY
// ===============================

function spawnEnergy() {

    energyTimer++;

    if (energy || energyTimer < 120) return;

    energyTimer = 0;

    energy = {
        x: 50 + Math.random() * (width - 100),
        y: 70 + Math.random() * (height - 140),
        radius: 9,
        pulse: 0
    };
}


function updateEnergy() {

    if (!energy) return;

    energy.pulse += 0.08;

    const distance = Math.hypot(
        player.x - energy.x,
        player.y - energy.y
    );

    if (
        distance <
        player.radius + energy.radius
    ) {

        score += 10;

        createExplosion(
            energy.x,
            energy.y,
            "#ffe66d",
            18
        );

        energy = null;
    }
}


// ===============================
// PARTICLES
// ===============================

function createParticle(x, y, color, speed = 1) {

    particles.push({
        x,
        y,
        vx: (Math.random() - 0.5) * speed,
        vy: (Math.random() - 0.5) * speed,
        life: 30,
        color
    });
}


function createExplosion(x, y, color, amount) {

    for (let i = 0; i < amount; i++) {

        const angle =
            Math.random() * Math.PI * 2;

        const speed =
            Math.random() * 5 + 1;

        particles.push({
            x,
            y,

            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,

            life: 30 + Math.random() * 30,

            color
        });
    }
}


function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.97;
        p.vy *= 0.97;

        p.life--;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}


// ===============================
// DRAW
// ===============================

function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    drawBackground();

    drawEnergy();

    drawEnemies();

    drawParticles();

    drawPlayer();
}


function drawBackground() {

    // Grid

    ctx.strokeStyle =
        "rgba(0,255,255,0.035)";

    ctx.lineWidth = 1;

    const gridSize = 50;

    for (
        let x = 0;
        x < width;
        x += gridSize
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);

        ctx.stroke();
    }

    for (
        let y = 0;
        y < height;
        y += gridSize
    ) {

        ctx.beginPath();

        ctx.moveTo(0, y);
        ctx.lineTo(width, y);

        ctx.stroke();
    }

    // Stars

    if (stars.length === 0) {

        for (let i = 0; i < 100; i++) {

            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2
            });
        }
    }

    ctx.fillStyle = "rgba(255,255,255,0.4)";

    stars.forEach(star => {

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });
}


// ===============================
// DRAW PLAYER
// ===============================

function drawPlayer() {

    if (
        player.invincible > 0 &&
        Math.floor(player.invincible / 5) % 2 === 0
    ) {
        return;
    }

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    const angle = Math.atan2(
        getMouseY() - player.y,
        getMouseX() - player.x
    );

    // Keep ship upright-ish
    ctx.rotate(angle + Math.PI / 2);

    // Glow

    ctx.shadowBlur = 25;
    ctx.shadowColor = "#00ffff";

    ctx.fillStyle = "#00ffff";

    ctx.beginPath();

    ctx.moveTo(0, -20);
    ctx.lineTo(13, 14);
    ctx.lineTo(0, 9);
    ctx.lineTo(-13, 14);

    ctx.closePath();

    ctx.fill();

    // Core

    ctx.shadowBlur = 10;
    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
}


// ===============================
// DRAW ENEMIES
// ===============================

function drawEnemies() {

    enemies.forEach(enemy => {

        ctx.save();

        ctx.translate(
            enemy.x,
            enemy.y
        );

        ctx.rotate(
            enemy.wobble
        );

        ctx.shadowBlur = 20;
        ctx.shadowColor = "#ff245e";

        ctx.fillStyle = "#ff245e";

        ctx.beginPath();

        for (let i = 0; i < 8; i++) {

            const angle =
                (Math.PI * 2 / 8) * i;

            const radius =
                i % 2 === 0
                ? enemy.radius
                : enemy.radius * 0.45;

            const x =
                Math.cos(angle) * radius;

            const y =
                Math.sin(angle) * radius;

            if (i === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        }

        ctx.closePath();
        ctx.fill();

        ctx.restore();
    });
}


// ===============================
// DRAW ENERGY
// ===============================

function drawEnergy() {

    if (!energy) return;

    const pulse =
        Math.sin(energy.pulse) * 3;

    ctx.save();

    ctx.shadowBlur = 30;
    ctx.shadowColor = "#ffe66d";

    ctx.fillStyle = "#ffe66d";

    ctx.beginPath();

    ctx.arc(
        energy.x,
        energy.y,
        energy.radius + pulse,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.arc(
        energy.x,
        energy.y,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
}


// ===============================
// DRAW PARTICLES
// ===============================

function drawParticles() {

    particles.forEach(p => {

        ctx.save();

        ctx.globalAlpha =
            Math.max(0, p.life / 50);

        ctx.fillStyle = p.color;

        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            2,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    });
}


// ===============================
// MOUSE
// ===============================

let mouseX = width / 2;
let mouseY = height / 2;

window.addEventListener("mousemove", e => {

    mouseX = e.clientX;
    mouseY = e.clientY;

});


function getMouseX() {
    return mouseX;
}


function getMouseY() {
    return mouseY;
}


// ===============================
// UI
// ===============================

function updateUI() {

    document.getElementById("score").textContent =
        "SCORE: " + score;

    document.getElementById("level").textContent =
        "LEVEL: " + level;

    let hearts = "";

    for (let i = 0; i < lives; i++) {
        hearts += "♥ ";
    }

    document.getElementById("lives").textContent =
        "LIVES: " + hearts;
}


// ===============================
// GAME OVER
// ===============================

function endGame() {

    gameRunning = false;

    document.getElementById("finalScore").textContent =
        "SCORE: " + score;

    document
        .getElementById("gameOverScreen")
        .classList.remove("hidden");
}


// ===============================
// GAME LOOP
// ===============================

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
